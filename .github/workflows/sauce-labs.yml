name: Testes iOS no Sauce Labs

on:
  push:
    branches:
      - ci
  pull_request:
    branches:
      - ci
  workflow_dispatch:

jobs:
  ios-sauce-labs:
    name: Fluxo de compra iOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_APP: ${{ secrets.SAUCE_APP }}
      SAUCE_DEVICE_NAME: ${{ secrets.SAUCE_DEVICE_NAME }}
      SAUCE_PLATFORM_VERSION: ${{ secrets.SAUCE_PLATFORM_VERSION }}
      SAUCE_BUILD: ebac-exerc30-${{ github.run_number }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes no Sauce Labs
        run: npm test